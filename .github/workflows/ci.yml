name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The runtime suite drives a real OpenCode binary and refuses any version other
  # than the one pinned in src/types.ts. Keep this in step with OPENCODE_VERSION.
  OPENCODE_PINNED_VERSION: 1.18.20
  # The interoperability suite runs the upstream example Guardian from the same
  # specification commit the vendored schemas come from (README, docs/coverage.md).
  ACS_SPEC_COMMIT: db457a84393bd80954c9b70b2271a719bf7c61cd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned OpenCode binary outside the package
        run: |
          mkdir -p "$RUNNER_TEMP/opencode-pinned"
          cd "$RUNNER_TEMP/opencode-pinned"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "opencode-ai@$OPENCODE_PINNED_VERSION"
          ./node_modules/.bin/opencode --version
          echo "OPENCODE_E2E_BIN=$RUNNER_TEMP/opencode-pinned/node_modules/.bin/opencode" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the upstream example Guardian at the pinned specification commit
        run: |
          python -m venv "$RUNNER_TEMP/acs-guardian"
          "$RUNNER_TEMP/acs-guardian/bin/pip" install --quiet "git+https://github.com/GenAI-Security-Project/agent-control-standard@$ACS_SPEC_COMMIT#subdirectory=adapters"
          "$RUNNER_TEMP/acs-guardian/bin/acs-example-guardian" --help >/dev/null
          echo "ACS_UPSTREAM_GUARDIAN=$RUNNER_TEMP/acs-guardian/bin/acs-example-guardian" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm pack --dry-run
